<!DOCTYPE html>
<!-- Arte de Builder Pyce (?p=builder, tipo Hammer Bro, guiño a Builderman de Roblox) y
     Miner Pyce (?p=miner, tipo Boomerang Bro: carcasa naranja, cristales rosas/lilas, brazo-ratón de cristal, poseído).
     Genera Enemigos/Pyces/<Builder|Miner> Pyce.png:
     msedge --headless --disable-gpu --hide-scrollbars --window-size=1080,1080
            --default-background-color=00000000 --screenshot="<png>" "file:///<ruta>/tools/BroArt.html?p=builder"
     Anatomía de los Pyces de tierra: monitor, pie (peana) abajo-izq, teclado abajo-dcha, ratón colgando del
     cable a la izquierda (espalda) y mano-paleta a la derecha. Miran a la DERECHA. -->
<html><head><meta charset="UTF-8">
<style>html,body{margin:0;background:transparent;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1080"></canvas>
<script>
const P = new URLSearchParams(location.search).get('p') || 'builder';
const c = document.getElementById('c'), x = c.getContext('2d');
const INK = '#0a0a0a', LW = 28;
x.lineJoin = 'round'; x.lineCap = 'round';

function path(pts, closed) {
  x.beginPath(); const n = pts.length;
  x.moveTo((pts[0][0] + pts[n - 1][0]) / 2, (pts[0][1] + pts[n - 1][1]) / 2);
  for (let i = 0; i < n; i++) { const a = pts[i], b = pts[(i + 1) % n]; x.quadraticCurveTo(a[0], a[1], (a[0] + b[0]) / 2, (a[1] + b[1]) / 2); }
  if (closed !== false) x.closePath();
}
function blob(pts, fill, lw) { path(pts); if (fill) { x.fillStyle = fill; x.fill(); } x.strokeStyle = INK; x.lineWidth = lw || LW; x.stroke(); }
function poly(pts, fill, lw) { x.beginPath(); pts.forEach(([a, b], i) => (i ? x.lineTo(a, b) : x.moveTo(a, b))); x.closePath(); if (fill) { x.fillStyle = fill; x.fill(); } x.strokeStyle = INK; x.lineWidth = lw || LW; x.stroke(); }
function rrect(px, py, w, h, r, fill, lw) { x.beginPath(); x.roundRect(px, py, w, h, r); if (fill) { x.fillStyle = fill; x.fill(); } x.strokeStyle = INK; x.lineWidth = lw || LW; x.stroke(); }
function line(pts, col, w) { x.beginPath(); pts.forEach(([a, b], i) => (i ? x.lineTo(a, b) : x.moveTo(a, b))); x.strokeStyle = col; x.lineWidth = w; x.stroke(); }
function cable(fn, col, wOut, wIn) { x.beginPath(); fn(); x.strokeStyle = INK; x.lineWidth = wOut; x.stroke(); x.beginPath(); fn(); x.strokeStyle = col; x.lineWidth = wIn; x.stroke(); }
// Ratón de los Pyces: borde de arriba plano (cable), "U" hacia abajo, rueda con palo hasta la curva
function mouse(mx, my, fill, wheel, rot) {
  x.save(); x.translate(mx, my); x.rotate(rot || 0);
  x.beginPath(); x.moveTo(-58, 0); x.lineTo(58, -6); x.bezierCurveTo(66, 60, 64, 120, 30, 150); x.quadraticCurveTo(0, 168, -30, 150); x.bezierCurveTo(-66, 120, -66, 60, -58, 0); x.closePath();
  x.fillStyle = fill; x.fill(); x.strokeStyle = INK; x.lineWidth = 24; x.stroke();
  line([[0, 86], [0, 160]], INK, 14);
  x.beginPath(); x.arc(0, 68, 18, 0, 7); x.fillStyle = wheel; x.fill(); x.strokeStyle = INK; x.lineWidth = 12; x.stroke();
  x.restore();
}
function keyboard(kx, ky, fill, keys, rot) {
  x.save(); x.translate(kx, ky); x.rotate(rot);
  rrect(-170, -70, 340, 140, 18, fill);
  x.fillStyle = keys; for (let r = 0; r < 3; r++) for (let k = 0; k < 6; k++) { x.beginPath(); x.roundRect(-140 + k * 47, -46 + r * 33, 38, 25, 5); x.fill(); x.strokeStyle = INK; x.lineWidth = 6; x.stroke(); }
  x.restore();
}
function foot(fill) { blob([[190, 860], [300, 820], [470, 830], [500, 900], [450, 960], [260, 965], [175, 920]], fill); }

x.save(); x.translate(500, 560); x.scale(0.84, 0.84); x.rotate(-0.04); x.translate(-540, -560);

if (P === 'builder') {
  const CASE = '#ff8a1f', SCR = '#ffd84a', BLK = '#1d1d22', HAT = '#ffd000', CYAN = '#2fd8f0';
  // martillo en la mano (detrás de la mano)
  x.save(); x.translate(905, 470); x.rotate(0.35);
  rrect(-20, -250, 40, 330, 14, '#b9793f');                     // mango de madera
  line([[-4, -220], [-4, 40]], '#d99a5c', 10);
  rrect(-110, -330, 220, 110, 16, '#9aa3b2');                   // cabeza
  x.fillStyle = '#c7cfdc'; x.beginPath(); x.roundRect(-90, -315, 70, 26, 10); x.fill();
  x.restore();
  // mano-paleta (negra, como los brazos de Builderman)
  blob([[790, 520], [880, 470], [950, 500], [955, 590], [900, 650], [820, 640]], BLK);
  // ratón negro colgando del cable
  cable(() => { x.moveTo(300, 470); x.bezierCurveTo(215, 460, 170, 500, 165, 578); }, '#3a3a44', 44, 18);
  mouse(165, 575, BLK, '#ffd000', -0.1);
  foot(BLK);
  keyboard(720, 880, BLK, '#4a4a55', 0.22);
  // monitor (torso naranja de Builderman)
  rrect(275, 300, 540, 470, 34, CASE);
  rrect(345, 360, 400, 300, 26, SCR, 24);
  // cara clásica de Roblox: dos ojos ovalados y sonrisa
  [[480, 470], [610, 470]].forEach(([ex, ey]) => { x.beginPath(); x.ellipse(ex, ey, 22, 38, 0, 0, 7); x.fillStyle = INK; x.fill(); });
  x.beginPath(); x.moveTo(445, 560); x.quadraticCurveTo(545, 640, 645, 560); x.strokeStyle = INK; x.lineWidth = 20; x.stroke();
  // pegatina de la llave inglesa en la carcasa
  x.save(); x.translate(735, 715); x.rotate(-0.7);
  rrect(-10, -38, 20, 64, 8, '#e8edf5', 9);
  x.beginPath(); x.arc(0, -42, 20, 0.35 * Math.PI, 2.65 * Math.PI); x.fillStyle = '#e8edf5'; x.fill(); x.strokeStyle = INK; x.lineWidth = 9; x.stroke();
  x.beginPath(); x.rect(-7, -66, 14, 22); x.fillStyle = CASE; x.fill();
  x.restore();
  // casco de obra amarillo con visera y franja cian (Builders Club)
  path([[300, 330], [310, 210], [400, 135], [545, 110], [690, 135], [780, 210], [790, 330]]);
  x.fillStyle = HAT; x.fill(); x.strokeStyle = INK; x.lineWidth = LW; x.stroke();
  line([[545, 118], [545, 318]], CYAN, 34); line([[545, 118], [545, 318]], INK, 0.01);
  x.beginPath(); x.moveTo(530, 116); x.lineTo(530, 318); x.moveTo(560, 116); x.lineTo(560, 318); x.strokeStyle = INK; x.lineWidth = 8; x.stroke();
  rrect(250, 300, 600, 52, 24, CYAN, 24);                       // visera
  x.fillStyle = 'rgba(255,255,255,0.55)'; x.beginPath(); x.ellipse(420, 190, 60, 22, -0.5, 0, 7); x.fill();
} else {
  const CASE = '#ff7a1a', CASED = '#d65a08', SCR = '#2a0f3a', PINK = '#ff6fc8', LIL = '#b48cff', LIGHT = '#ffd6f0';
  // Cristal: punta con faceta clara y sombra lila
  function crystal(cx, cy, w, h, rot) {
    x.save(); x.translate(cx, cy); x.rotate(rot);
    poly([[-w / 2, 0], [-w / 2, -h * 0.7], [0, -h], [w / 2, -h * 0.7], [w / 2, 0]], PINK, 20);
    x.beginPath(); x.moveTo(0, -h); x.lineTo(w / 2, -h * 0.7); x.lineTo(w / 2, 0); x.lineTo(0, 0); x.closePath(); x.fillStyle = LIL; x.fill();
    x.beginPath(); x.moveTo(-w * 0.28, -h * 0.12); x.lineTo(-w * 0.28, -h * 0.62); x.strokeStyle = LIGHT; x.lineWidth = 10; x.stroke();
    poly([[-w / 2, 0], [-w / 2, -h * 0.7], [0, -h], [w / 2, -h * 0.7], [w / 2, 0]], null, 20);
    x.restore();
  }
  // pico de cristal en la mano (lo que lanza como bumerán)
  x.save(); x.translate(915, 470); x.rotate(0.3);
  rrect(-18, -240, 36, 320, 14, '#7a4a2a');
  x.beginPath(); x.moveTo(-170, -200); x.quadraticCurveTo(0, -330, 170, -200); x.lineTo(140, -180); x.quadraticCurveTo(0, -270, -140, -180); x.closePath();
  x.fillStyle = PINK; x.fill(); x.strokeStyle = INK; x.lineWidth = 22; x.stroke();
  x.beginPath(); x.moveTo(-110, -215); x.quadraticCurveTo(0, -280, 110, -215); x.strokeStyle = LIGHT; x.lineWidth = 10; x.stroke();
  x.restore();
  blob([[790, 520], [880, 470], [950, 500], [955, 590], [900, 650], [820, 640]], CASE);
  // brazo-ratón de CRISTAL puro: cable de cristal en tramos + ratón de cristal
  [[300, 455, 250, 440], [250, 440, 200, 470], [200, 470, 168, 576]].forEach(([a, b, cc, d]) => { cable(() => { x.moveTo(a, b); x.lineTo(cc, d); }, PINK, 46, 22); });
  [[250, 440], [200, 470]].forEach(([a, b]) => { x.beginPath(); x.arc(a, b, 16, 0, 7); x.fillStyle = LIL; x.fill(); x.strokeStyle = INK; x.lineWidth = 10; x.stroke(); });
  mouse(165, 575, PINK, LIGHT, -0.1);
  x.save(); x.translate(165, 575); x.rotate(-0.1);
  x.beginPath(); x.moveTo(20, 10); x.bezierCurveTo(50, 60, 48, 110, 24, 140); x.lineTo(40, 20); x.closePath(); x.fillStyle = LIL; x.fill();
  line([[-34, 30], [-38, 100]], LIGHT, 10);
  x.restore();
  foot(CASED);
  keyboard(720, 880, CASED, '#5a2a10', 0.22);
  // cristales brotando de la espalda/arriba (detrás del monitor)
  crystal(330, 340, 110, 260, -0.55);
  crystal(430, 320, 130, 320, -0.2);
  crystal(560, 315, 100, 240, 0.12);
  crystal(680, 330, 120, 290, 0.45);
  // monitor naranja, con una grieta de la que asoma cristal
  rrect(275, 300, 540, 470, 34, CASE);
  rrect(345, 360, 400, 300, 26, SCR, 24);
  line([[275, 640], [320, 610], [305, 580], [345, 560]], INK, 12);
  crystal(800, 760, 60, 110, 0.6);
  crystal(300, 770, 50, 90, -0.5);
  // cara poseída: ojos rasgados que brillan rosa, sonrisa torcida con colmillos
  x.save(); x.shadowColor = PINK; x.shadowBlur = 40;
  [[470, 470, -0.35], [620, 470, 0.35]].forEach(([ex, ey, r]) => { x.save(); x.translate(ex, ey); x.rotate(r); x.beginPath(); x.ellipse(0, 0, 50, 20, 0, 0, 7); x.fillStyle = PINK; x.fill(); x.beginPath(); x.ellipse(0, 0, 12, 18, 0, 0, 7); x.fillStyle = '#fff'; x.fill(); x.restore(); });
  x.restore();
  x.beginPath(); x.moveTo(440, 575); x.quadraticCurveTo(500, 610, 545, 585); x.quadraticCurveTo(600, 620, 660, 565); x.strokeStyle = LIL; x.lineWidth = 16; x.stroke();
  x.fillStyle = LIGHT; [[480, 592], [610, 596]].forEach(([fx, fy]) => { x.beginPath(); x.moveTo(fx - 10, fy - 4); x.lineTo(fx + 10, fy - 4); x.lineTo(fx, fy + 22); x.closePath(); x.fill(); });
  // vetas de energía lila en la pantalla
  line([[370, 400], [400, 430], [390, 470]], 'rgba(180,140,255,0.6)', 8);
  line([[715, 620], [690, 600], [700, 570]], 'rgba(180,140,255,0.6)', 8);
}
x.restore();
</script></body></html>
