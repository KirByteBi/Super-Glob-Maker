<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><link rel="stylesheet" href="../css/style.css"></head>
<body>
<div id="stage"><canvas id="game" width="1024" height="576"></canvas><div id="editor-ui"></div><div id="screen" class="screen"></div><div id="modal"></div><div id="toast"></div></div>
<pre id="err" style="position:fixed;left:0;top:0;color:#f00;background:#fff;z-index:99;font-size:12px;margin:0"></pre>
<script>
  window.onerror = (m, s, l, c, e) => { document.getElementById('err').textContent += m + ' @' + (s||'').split('/').pop() + ':' + l + '\n'; };
  // Las imágenes deben resolverse relativas a la raíz del juego
  document.write('<base href="../">');
</script>
<script src="js/core/sgm.js"></script>
<script src="js/model/Characters.js"></script><script src="js/model/Themes.js"></script><script src="js/model/Catalog.js"></script>
<script src="js/model/Level.js"></script><script src="js/model/LevelStorage.js"></script><script src="js/model/Physics.js"></script>
<script src="js/model/entities/Entity.js"></script><script src="js/model/entities/Enemies.js"></script><script src="js/model/entities/EnemiesSpecial.js"></script><script src="js/model/entities/Objects.js"></script>
<script src="js/model/Player.js"></script><script src="js/model/GameModel.js"></script><script src="js/model/EditorModel.js"></script><script src="js/model/SampleLevels.js"></script>
<script src="js/view/PyceArt.js"></script><script src="js/view/Assets.js"></script><script src="js/view/Sprites.js"></script><script src="js/view/BackgroundView.js"></script>
<script src="js/view/ParticlesView.js"></script><script src="js/view/WorldRenderer.js"></script><script src="js/view/HUDView.js"></script>
<script src="js/view/SoundView.js"></script><script src="js/view/EditorView.js"></script><script src="js/view/MenuView.js"></script>
<script src="js/controller/InputController.js"></script><script src="js/controller/GameController.js"></script>
<script src="js/controller/EditorController.js"></script><script src="js/controller/AppController.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  const S = SGM;
  window.addEventListener('DOMContentLoaded', () => {
    S.app = new S.Controller.AppController();
    S.app.start();
    setTimeout(() => {
      try {
        const what = q.get('v');
        if (what === 'play') {
          const L = S.Model.SampleLevels.build(q.get('t'), q.get('m'));
          S.app.playLevel(L.toJSON(), { character: q.get('c') || 'green' });
          const g = S.app.game.model;
          // avanzar un poco y darle una evolución para ver el sprite grande
          g.player.setForm(+(q.get('e') || 0), q.get('s') || null);
          g.t = 3;
          for (let i = 0; i < 120 * (+(q.get('sec') || 2)); i++) g.update(1 / 120, { right: true, run: false, jump: i % 90 < 40, jumpPressed: i % 90 === 0 });
        } else if (what === 'editor') { S.app.openEditor(S.Model.SampleLevels.build(q.get('t') || 'lake', q.get('m') || 'peace')); if (q.get('cat')) { S.app.editor.view.cat = q.get('cat'); S.app.editor.view.buildToolbar(S.app.editor.model, S.app.editor.handlers()); } }
        else if (what === 'story') S.app.showStory();
        else if (what === 'chars') S.app.menu.characterPicker('green', () => {}, () => {});
      } catch (e) { document.getElementById('err').textContent += e.stack; }
    }, 1500);
  });
</script>
</body></html>
